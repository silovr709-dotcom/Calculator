name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm test
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    # Публикуем и main, и текущую рабочую ветку Arena, чтобы ссылку можно было
    # проверить до merge. Для других arena-веток достаточно проверки сборки.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a0ee6f-calculator'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      # Отдельное окружение без правила «только main», чтобы рабочую Arena-ветку
      # можно было открыть по публичной ссылке до слияния.
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
